[package]
name = "baseline_lindera"
version = "0.1.0"
edition = "2024"
description = "Baseline furigana annotator using Lindera with IPADIC"

[dependencies]
lindera = { version = "2.0.1", features = ["embed-ipadic"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"

[[bin]]
name = "baseline_lindera"
path = "src/main.rs"

[lib]
name = "baseline_lindera"
path = "src/lib.rs"
